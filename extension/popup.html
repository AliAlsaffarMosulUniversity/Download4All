<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { font: 13px system-ui, sans-serif; width: 260px; margin: 0; padding: 14px; color: #1f2937; }
  h1 { font-size: 15px; margin: 0 0 10px; display: flex; align-items: center; gap: 8px; }
  h1 img { width: 22px; height: 22px; }
  .row { display: flex; justify-content: space-between; align-items: center; margin: 9px 0; }
  input[type=number], input[type=text] { width: 90px; padding: 3px 5px; }
  #status { font-size: 12px; padding: 6px 8px; border-radius: 6px; background: #f3f4f6; }
  .on { color: #0f766e; } .off { color: #b91c1c; }
  small { color: #6b7280; }
</style>
</head>
<body>
  <h1><img src="icons/icon48.png" alt="">JDM Integration</h1>
  <div id="status">Checking JDM…</div>
  <div class="row"><label for="enabled">Capture downloads</label><input type="checkbox" id="enabled"></div>
  <div class="row"><label for="minSizeKB">Ignore files smaller than (KB)</label><input type="number" id="minSizeKB" min="0"></div>
  <div class="row"><label for="skipExt">Ignore types</label><input type="text" id="skipExt" placeholder="jpg,png"></div>
  <small>When JDM is closed, the browser downloads normally.</small>
  <script src="popup.js"></script>
</body>
</html>
